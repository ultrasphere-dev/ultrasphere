[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ultrasphere"
version = "2.1.0"
description = "Hyperspherical coordinates in NumPy / PyTorch / JAX."
readme = "README.md"
license = "MIT"
authors = [
  { name = "ultrasphere-dev" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aquarel>=0.0.7",
  "array-api-compat>=1.12",
  "array-api-extra>=0.8",
  "jacobi-poly>=1.0.7",
  "matplotlib>=3.10.3",
  "networkx>=3.5",
  "pytest-xdist>=3.8",
  "rich>=10",
  "scipy>=1.15.3",
  "strenum>=0.4.15",
  "typer>=0.15,<1",
  "types-array-api>=1.1.4",
]
optional-dependencies.plot = [
  "pydot>=4.0.1",
  "pygraphviz>=1.14",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/ultrasphere/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/ultrasphere/blob/main/CHANGELOG.md"
urls.documentation = "https://ultrasphere.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/ultrasphere"
scripts.ultrasphere = "ultrasphere.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.7",
  "pytest",
  "pytest-cov",
  "torch>=2.7.1",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-ignore = [
  "A001",   # builtin-variable-shadowing
  "A002",   # builtin-argument-shadowing
  "D401",   # non-imperative-mood
  "D417",   # undocumented-param
  "DOC201", # docstring-missing-returns
  "DOC202", # docstring-extraneous-returns
  "DOC402", # docstring-missing-yields
  "DOC501", # docstring-missing-exception
  "DOC502", # docstring-extraneous-exception
  "E501",   # line-too-long in doctest and math examples
  "FBT001", # boolean-type-hint-positional-argument
  "FBT002", # boolean-default-value-positional-argument
  "FBT003", # boolean-positional-value-in-call
  "NPY002", # numpy-legacy-random
  "S404",   # suspicious-subprocess-import in tests
  "S603",   # subprocess-without-shell-equals-true in tests
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
