[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ultrasphere"
version = "2.0.4"
description = "Hyperspherical coordinates in NumPy / PyTorch / JAX."
readme = "README.md"
license = "MIT"
authors = [
  { name = "ultrasphere-dev" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aquarel>=0.0.7",
  "array-api-compat>=1.12",
  "array-api-extra>=0.8",
  "jacobi-poly>=1.0.3",
  "matplotlib>=3.10.3",
  "networkx>=3.5",
  "pytest-xdist>=3.8",
  "rich>=10",
  "scipy>=1.15.3",
  "strenum>=0.4.15",
  "typer>=0.15,<1",
  "types-array-api>=1.1.4",
]
optional-dependencies.plot = [
  "pydot>=4.0.1",
  "pygraphviz>=1.14",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/ultrasphere/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/ultrasphere/blob/main/CHANGELOG.md"
urls.documentation = "https://ultrasphere.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/ultrasphere"
scripts.ultrasphere = "ultrasphere.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "sybil>=9.2",
  "torch>=2.7.1",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = [
  "docs/.*",
  "setup.py",
]
overrides = [ { module = "tests.*", allow_untyped_defs = true }, { module = "docs.*", ignore_errors = true } ]

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=ultrasphere
    --cov-report=term
    --cov-report=xml
    """
ini_options.pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
version_variables = [
  "src/ultrasphere/__init__.py:__version__",
  "docs/conf.py:release",
]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
changelog.environment.keep_trailing_newline = true
